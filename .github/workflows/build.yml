name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            output_name: gris_paint.exe
            artifact_name: gris_paint-Windows
          - os: ubuntu-latest
            output_name: gris_paint
            artifact_name: gris_paint-Linux
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Compile Pyinstaller Bootloader
      run: |
        git clone https://github.com/pyinstaller/pyinstaller.git
        cd pyinstaller/bootloader
        python ./waf all
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        cd pyinstaller
        pip install .
    - name: Install UPX
      uses: crazy-max/ghaction-upx@v4.0.0
      with:
        install-only: true
    - name: Build executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --windowed --add-data "files:files" --name gris_paint --clean gris_paint.py
    
    - name: Build executable (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --onefile --windowed --add-data "files:files" --noupx --name gris_paint --clean gris_paint.py
    
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.output_name }}
      
    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: dist/${{ matrix.output_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
